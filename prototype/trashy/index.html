<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#000;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#fff;
    touch-action:none;overscroll-behavior:none;image-rendering:pixelated;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
  .layer{position:fixed;inset:0;pointer-events:none;}

  /* skin switcher */
  #skins{top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;display:flex;gap:6px;justify-content:center;}
  .skin{pointer-events:auto;background:#000;border:2px solid #fff;color:#fff;font-family:inherit;
    font-weight:900;font-size:11px;letter-spacing:.05em;padding:6px 12px;text-transform:uppercase;
    box-shadow:3px 3px 0 rgba(255,255,255,.25);}
  .skin.on{background:#fff;color:#000;}
  .skin:active{transform:translate(1px,1px);}

  /* bottom controls (chunky trashy buttons) */
  #controls{bottom:0;padding:0 12px calc(env(safe-area-inset-bottom) + 14px);
    display:flex;align-items:flex-end;justify-content:space-between;}
  .btn{pointer-events:auto;background:#000;border:3px solid #fff;color:#fff;font-family:inherit;
    font-weight:900;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:11px 13px;
    box-shadow:4px 4px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(255,255,255,.2);}
  .btn small{font-size:8px;font-weight:700;opacity:.7;letter-spacing:.08em;}
  .btn.ability{border-color:#ffd23f;color:#ffd23f;box-shadow:4px 4px 0 rgba(255,210,63,.25);position:relative;overflow:hidden;}
  .btn.ability .cd{position:absolute;inset:0;background:rgba(0,0,0,.72);transform-origin:bottom;}
  .btn.ico{min-width:0;font-size:18px;}

  /* overlays */
  .over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:rgba(8,6,16,.9);z-index:20;}
  .over.show{display:flex;}
  .logo{font-size:min(17vw,74px);font-weight:900;letter-spacing:-.02em;line-height:.9;color:#fff;
    text-shadow:5px 5px 0 #ff2266,-3px -3px 0 #2de2e6;text-transform:uppercase;text-wrap:balance;}
  .tag{margin-top:14px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#ffd23f;}
  .sub{margin:18px 0 4px;max-width:330px;font-size:12px;line-height:1.7;color:#c9c2d6;}
  .big{margin-top:26px;pointer-events:auto;background:#ffd23f;color:#140f1f;border:3px solid #fff;
    font-family:inherit;font-weight:900;font-size:15px;letter-spacing:.1em;text-transform:uppercase;
    padding:15px 34px;box-shadow:6px 6px 0 rgba(255,255,255,.25);}
  .big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 rgba(255,255,255,.25);}
  .result{display:flex;gap:20px;margin-top:8px;}
  .result div{display:flex;flex-direction:column;}
  .result b{font-size:26px;color:#fff;font-variant-numeric:tabular-nums;}
  .result span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9a90ad;}
  .shopgrid{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px;margin-top:18px;}
  .up{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#000;border:2px solid #fff;
    padding:11px 13px;text-align:left;color:#fff;font-family:inherit;}
  .up:active{transform:translate(2px,2px);}
  .up:disabled{opacity:.35;}
  .up .ic{font-size:20px;width:26px;text-align:center;}
  .up .t{flex:1;}
  .up .t b{display:block;font-size:12px;}
  .up .t span{font-size:9px;color:#9a90ad;}
  .up .c{font-size:12px;font-weight:900;color:#ffd23f;white-space:nowrap;}
  .hint{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(255,255,255,.55);text-align:center;transition:opacity .5s;pointer-events:none;}
</style>

<div id="wrap"><canvas id="game"></canvas></div>

<div class="layer" id="skins">
  <button class="skin on" data-s="A">A·Dirt Jam</button>
  <button class="skin" data-s="B">B·VHS</button>
  <button class="skin" data-s="C">C·Acid</button>
</div>

<div class="layer" id="controls">
  <button class="btn ico" id="btnExtract">⏏<small>Home</small></button>
  <button class="btn ico" id="btnSound">🔊</button>
  <button class="btn ability" id="btnShock">Blast<small>[space]</small><i class="cd" id="shockCd"></i></button>
</div>
<div class="hint" id="hint">Finger unten · ziehen zum Bohren</div>

<div class="over show" id="titleOver">
  <div class="logo">Core<br>Breaker</div>
  <div class="tag">// trashy build //</div>
  <div class="sub">Bohr in den Planeten. Sammle Zeug, pass auf FUEL &amp; Hitze auf, fahr HOME und rüste auf.
    Oben A/B/C = Skin wechseln.</div>
  <button class="big" id="btnStart">Drop In</button>
</div>

<div class="over" id="shopOver">
  <div class="tag" style="color:#ff8a3d">// extracted //</div>
  <div class="result">
    <div><b id="rDepth">0</b><span>Meter</span></div>
    <div><b id="rHaul">0</b><span>Loot</span></div>
    <div><b id="rCredits">0</b><span>Cash</span></div>
  </div>
  <div class="sub" style="margin-top:14px">Upgrade die Rostlaube. Dann tiefer.</div>
  <div class="shopgrid" id="shopGrid"></div>
  <button class="big" id="btnDescend" style="margin-top:18px">Drop In</button>
</div>

<script>
(function(){
"use strict";
(function(){var m=document.querySelector('meta[name=viewport]');
 if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}
 m.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
 if(!document.title)document.title='COREBREAKER · trashy';})();

/* ===================== THEMES ===================== */
const THEMES={
 A:{name:'DIRT JAM', space:'#150f22', space2:'#0a0713',
    ground:['#8b909b','#c9cdd4','#5c6069'], accent:'#ffd23f', ore:'#ffe28a',
    dmg:'#ff3b6b', fuel:'#ff8a3d', blob:'#ffe14d', ring:'#c9cdd4',
    ca:1.4, scan:0.05, noise:0.04, tint:null, jitter:0, planet:'#c9cdd4'},
 B:{name:'VHS MELTDOWN', space:'#080810', space2:'#04040a',
    ground:['#83838c','#dcdce2','#4e4e57'], accent:'#39ff14', ore:'#eaff00',
    dmg:'#ff2266', fuel:'#ff6a00', blob:'#eaff00', ring:'#dcdce2',
    ca:3.6, scan:0.16, noise:0.13, tint:'#12ff7a', jitter:1, planet:'#dcdce2'},
 C:{name:'ACID CAVE', space:'#0b0e1a', space2:'#05060d',
    ground:['#2b3550','#4de0ff','#7a4dff'], accent:'#2de2e6', ore:'#b6fff2',
    dmg:'#ff4de0', fuel:'#12d9b0', blob:'#b6fff2', ring:'#4de0ff',
    ca:1.9, scan:0.07, noise:0.05, tint:null, jitter:0, planet:'#4de0ff'},
};
let TK='A', T=THEMES.A;

/* ===================== CORE ===================== */
const TILE=46, COLS=9;
function rngSeed(s){return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
let rnd=rngSeed(Date.now()>>>0);
function hash(c,r){let h=(c*374761393+r*668265263)>>>0;h=((h^(h>>13))*1274126177)>>>0;return h>>>0;}

const SAVE_KEY='corebreaker_trashy_v1';
const meta=loadMeta();
function loadMeta(){try{const j=JSON.parse(localStorage.getItem(SAVE_KEY));if(j&&j.v===1)return j;}catch(e){}
  return{v:1,credits:0,up:{power:0,speed:0,energy:0,cool:0,magnet:0}};}
function saveMeta(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(meta));}catch(e){}}

const UPGRADES=[
  {id:'power', ic:'⛏️', name:'Bohrkraft',      desc:'Härteres Gestein schneller', base:120,mult:1.7},
  {id:'speed', ic:'💨', name:'Speed',          desc:'Schneller bewegen & bohren',  base:100,mult:1.6},
  {id:'energy',ic:'🛢️', name:'Fuel-Tank',      desc:'Mehr Sprit & Regen',          base:110,mult:1.65},
  {id:'cool',  ic:'❄️', name:'Kühlung',         desc:'Weniger Hitze',               base:100,mult:1.6},
  {id:'magnet',ic:'🧲', name:'Magnet',          desc:'Loot aus mehr Distanz',       base:90, mult:1.7},
];
function upCost(u){return Math.round(u.base*Math.pow(u.mult,meta.up[u.id]));}
function stats(){const u=meta.up;return{
  power:34+u.power*20, speed:250+u.speed*42, energyMax:100+u.energy*45, energyRegen:9+u.energy*3.2,
  coolRate:16+u.cool*7, heatGen:Math.max(3,11-u.cool*1.4), magnet:70+u.magnet*46,
  tier:Math.min(6,1+Math.floor((u.power+u.speed+u.energy+u.cool+u.magnet)/3))};}

const RES={
  ferrite:{name:'Scrap',   color:'#c9d4e0',glow:'#eef4ff',value:6,  rar:'common'},
  cuprite:{name:'Copper',  color:'#ff9d5c',glow:'#ffd9b0',value:16, rar:'common'},
  crystal:{name:'Shard',   color:'#5cf0d8',glow:'#b6fff2',value:44, rar:'uncommon'},
  core:   {name:'Core',    color:'#2de2e6',glow:'#c8ffff',value:130,rar:'rare'},
  artifact:{name:'Relic',  color:'#8a5cff',glow:'#e6d8ff',value:520,rar:'legendary'},
};
const HARD={dirt:16,stone:34,hard:64,dark:96};
function genTile(depthM){let rock='dirt';
  if(depthM>60)rock='dark';else if(depthM>32)rock='hard';else if(depthM>10)rock='stone';
  let res=null;const oreRoll=rnd();
  if(oreRoll<0.15){
    if(depthM>70&&rnd()<0.05)res='artifact';
    else if(depthM>45&&rnd()<0.16)res='core';
    else if(depthM>22&&rnd()<0.30)res='crystal';
    else if(depthM>8&&rnd()<0.5)res='cuprite'; else res='ferrite';}
  return{rock,res,hp:HARD[rock],maxhp:HARD[rock]};}

const world=new Map();const key=(c,r)=>c+','+r;
function tileAt(c,r){if(c<0||c>=COLS)return{wall:true};if(r<0)return null;
  const k=key(c,r);if(world.has(k))return world.get(k);
  const t=r===0?{rock:'dirt',res:null,hp:HARD.dirt*0.4,maxhp:HARD.dirt*0.4}:genTile(r);
  world.set(k,t);return t;}

/* ===================== STATE ===================== */
let S=stats();
const run={active:false,depthMax:0,haul:0,energy:S.energyMax,heat:0,shockCd:0};
const drill={x:(COLS/2)*TILE,y:-TILE*0.5,vx:0,vy:0,rot:0,face:Math.PI/2};
const drops=[],parts=[],dmgnums=[];
let shake=0,flash=0,hitstop=0,drilling=false,glitch=0;

/* ===================== INPUT ===================== */
const input={active:false,ax:0,ay:0,dx:0,dy:0,mag:0};
const MAXR=92,DEAD=11;
function setInput(px,py){let dx=px-input.ax,dy=py-input.ay;const d=Math.hypot(dx,dy);
  if(d>MAXR){dx*=MAXR/d;dy*=MAXR/d;}input.dx=dx;input.dy=dy;
  input.mag=Math.min(1,Math.max(0,(Math.hypot(dx,dy)-DEAD)/(MAXR-DEAD)));}
const cv=document.getElementById('game');
function pt(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function onDown(e){if(!run.active)return;const t=pt(e);input.active=true;input.ax=t.x;input.ay=t.y;setInput(t.x,t.y);hideHint();}
function onMove(e){if(input.active){const t=pt(e);setInput(t.x,t.y);e.preventDefault();}}
function onUp(){input.active=false;input.mag=0;input.dx=input.dy=0;}
cv.addEventListener('touchstart',onDown,{passive:false});
cv.addEventListener('touchmove',onMove,{passive:false});
cv.addEventListener('touchend',onUp);cv.addEventListener('touchcancel',onUp);
cv.addEventListener('mousedown',onDown);
window.addEventListener('mousemove',e=>{if(input.active)onMove(e);});
window.addEventListener('mouseup',onUp);
const kb={};
window.addEventListener('keydown',e=>{kb[e.key.toLowerCase()]=true;if(e.key===' ')shockwave();});
window.addEventListener('keyup',e=>{kb[e.key.toLowerCase()]=false;});
function kbVec(){let x=0,y=0;if(kb['arrowleft']||kb['a'])x-=1;if(kb['arrowright']||kb['d'])x+=1;
  if(kb['arrowup']||kb['w'])y-=1;if(kb['arrowdown']||kb['s'])y+=1;
  if(x||y){const m=Math.hypot(x,y);return{dx:x/m,dy:y/m};}return null;}

/* ===================== AUDIO ===================== */
let AC=null,muted=false;
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function blip(f,dur,type,vol,slide){if(muted)return;const a=audio();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
  g.gain.setValueAtTime(vol||0.15,a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);}
function noise(dur,vol){if(muted)return;const a=audio();if(!a)return;
  const n=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=n.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(),g=a.createGain();s.buffer=n;g.gain.value=vol||0.08;
  s.connect(g);g.connect(a.destination);s.start();}
const sfx={tick:()=>noise(0.03,0.05),brk:()=>blip(170+rnd()*70,0.11,'square',0.11,85),
  rare:()=>{blip(520,0.1,'triangle',0.18);setTimeout(()=>blip(760,0.12,'triangle',0.2),90);},
  leg:()=>{[440,660,880,1320].forEach((f,i)=>setTimeout(()=>blip(f,0.2,'sawtooth',0.16),i*100));},
  shock:()=>{blip(90,0.4,'sawtooth',0.22,1200);noise(0.3,0.12);},
  ui:()=>blip(640,0.06,'square',0.12),buy:()=>{blip(520,0.08,'square',0.14);setTimeout(()=>blip(780,0.1,'square',0.14),70);}};
function vibe(p){if(!muted&&navigator.vibrate)try{navigator.vibrate(p);}catch(e){}}

/* ===================== FX ===================== */
function burst(x,y,color,n,spd){for(let i=0;i<n;i++){const a=rnd()*6.283,s=(spd||1)*(40+rnd()*160);
  parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.5+rnd()*0.5,age:0,color,size:1+(rnd()<0.5?1:2)});}}
function dmgNum(x,y,v,color){dmgnums.push({x:x+(rnd()-0.5)*10,y,v:Math.round(v*10)/10,age:0,life:0.7,color});}

/* ===================== MINING ===================== */
function collectRes(id,wx,wy){const r=RES[id];drops.push({x:wx,y:wy,id,got:false,t:0});
  if(r.rar==='rare'){sfx.rare();vibe([12,30,12,30,40]);flash=Math.max(flash,0.5);shake=Math.max(shake,10);glitch=0.25;}
  else if(r.rar==='legendary'){sfx.leg();vibe([20,40,20,40,20,60,120]);flash=Math.max(flash,0.9);shake=Math.max(shake,18);glitch=0.5;}
  else if(r.rar==='uncommon'){sfx.rare();vibe([8,20,25]);}else vibe(6);}
let tickAcc=0;
function mineTile(c,r,dmg){const t=tileAt(c,r);if(!t||t.wall)return false;t.hp-=dmg;
  const wx=c*TILE+TILE/2,wy=r*TILE+TILE/2;
  tickAcc+=dmg;if(tickAcc>7){dmgNum(wx,wy-6,tickAcc,T.dmg);tickAcc=0;}
  if(rnd()<0.3)burst(wx,wy,T.ground[2],1,0.5);
  if(t.hp<=0){world.set(key(c,r),null);burst(wx,wy,T.accent,10,1);shake=Math.max(shake,3.5);hitstop=0.02;
    sfx.brk();vibe(4);if(t.res)collectRes(t.res,wx,wy);return true;}
  return false;}

function shockwave(){if(!run.active||run.shockCd>0)return;
  if(run.energy<22){sfx.ui();return;}run.energy-=22;run.shockCd=5;
  const cc=Math.round((drill.x-TILE/2)/TILE),cr=Math.round((drill.y-TILE/2)/TILE),R=2;
  for(let dc=-R;dc<=R;dc++)for(let dr=-R;dr<=R;dr++)if(dc*dc+dr*dr<=R*R+1)mineTile(cc+dc,cr+dr,9999);
  shake=Math.max(shake,16);flash=Math.max(flash,0.55);hitstop=0.05;glitch=0.3;
  sfx.shock();vibe([18,25,60]);burst(drill.x,drill.y,T.blob,26,1.6);}

/* ===================== RUN ===================== */
function startRun(){S=stats();world.clear();rnd=rngSeed(Date.now()>>>0);
  run.active=true;run.depthMax=0;run.haul=0;run.energy=S.energyMax;run.heat=0;run.shockCd=0;
  drill.x=(COLS/2)*TILE+TILE/2;drill.y=-TILE*0.4;drill.vx=drill.vy=0;drill.rot=0;
  drops.length=0;parts.length=0;dmgnums.length=0;shake=flash=hitstop=0;
  hide('titleOver');hide('shopOver');showHint();if(audio()&&AC.state==='suspended')AC.resume();}
function extract(){if(!run.active)return;run.active=false;meta.credits+=Math.round(run.haul);saveMeta();
  document.getElementById('rDepth').textContent=run.depthMax;
  document.getElementById('rHaul').textContent=Math.round(run.haul);
  document.getElementById('rCredits').textContent=meta.credits;
  buildShop();show('shopOver');sfx.ui();vibe([10,20,40]);}
function buildShop(){const g=document.getElementById('shopGrid');g.innerHTML='';
  UPGRADES.forEach(u=>{const lvl=meta.up[u.id],cost=upCost(u),can=meta.credits>=cost;
    const b=document.createElement('button');b.className='up';b.disabled=!can;
    b.innerHTML='<span class="ic">'+u.ic+'</span><span class="t"><b>'+u.name+' · Lv '+lvl+'</b><span>'+u.desc+'</span></span><span class="c">'+cost+'$</span>';
    b.onclick=()=>{if(meta.credits>=upCost(u)){meta.credits-=upCost(u);meta.up[u.id]++;saveMeta();sfx.buy();vibe(12);buildShop();
      document.getElementById('rCredits').textContent=meta.credits;}};g.appendChild(b);});}

/* ===================== UPDATE ===================== */
let curDt=0.016;
function update(dt){curDt=dt;if(!run.active)return;
  let vx=0,vy=0,mag=0;const kv=kbVec();
  if(input.active&&input.mag>0){vx=input.dx;vy=input.dy;mag=input.mag;const d=Math.hypot(vx,vy)||1;vx/=d;vy/=d;}
  else if(kv){vx=kv.dx;vy=kv.dy;mag=1;}
  const throttled=run.heat>=95,spd=S.speed*(throttled?0.35:1);
  drill.vx=vx*mag*spd;drill.vy=vy*mag*spd;
  drilling=false;moveAxis('x',drill.vx*dt);moveAxis('y',drill.vy*dt);
  if(mag>0.05){drill.rot+=dt*(8+mag*14);drill.face=Math.atan2(vy,vx);}
  if(drilling){run.energy-=(9+S.power/12)*dt;run.heat=Math.min(100,run.heat+S.heatGen*dt);if(rnd()<0.5)sfx.tick();}
  else{run.energy=Math.min(S.energyMax,run.energy+S.energyRegen*dt);run.heat=Math.max(0,run.heat-S.coolRate*dt);}
  if(run.energy<0)run.energy=0;
  const dm=Math.max(0,Math.floor(drill.y/TILE));if(dm>run.depthMax)run.depthMax=dm;
  if(run.shockCd>0)run.shockCd=Math.max(0,run.shockCd-dt);
  for(let i=drops.length-1;i>=0;i--){const dp=drops[i];dp.t+=dt;
    const dx=drill.x-dp.x,dy=drill.y-dp.y,dist=Math.hypot(dx,dy);
    if(dist<S.magnet||dp.got){dp.got=true;dp.x+=dx*Math.min(1,dt*14);dp.y+=dy*Math.min(1,dt*14);}
    if(dist<18){run.haul+=RES[dp.id].value*(1+meta.up.magnet*0.05);burst(drill.x,drill.y,RES[dp.id].glow,7,1.1);drops.splice(i,1);}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.age+=dt;if(p.age>=p.life){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.vx*=0.96;}
  for(let i=dmgnums.length-1;i>=0;i--){const d=dmgnums[i];d.age+=dt;d.y-=26*dt;if(d.age>=d.life)dmgnums.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*26);
  if(flash>0)flash=Math.max(0,flash-dt*1.6);
  if(glitch>0)glitch=Math.max(0,glitch-dt*1.2);}
function moveAxis(axis,amt){if(amt===0)return;const rad=TILE*0.4;
  let nx=drill.x+(axis==='x'?amt:0),ny=drill.y+(axis==='y'?amt:0);
  if(axis==='x')nx=Math.max(TILE*0.42,Math.min(COLS*TILE-TILE*0.42,nx));
  if(axis==='y'&&ny<-TILE*0.4)ny=-TILE*0.4;
  const dir=Math.sign(amt),px=nx+(axis==='x'?dir*rad:0),py=ny+(axis==='y'?dir*rad:0);
  const c=Math.floor(px/TILE),r=Math.floor(py/TILE),t=tileAt(c,r);
  if(t&&!t.wall){drilling=true;mineTile(c,r,S.power*(run.energy>0?1:0.3)*curDt);return;}
  if(t&&t.wall)return;drill.x=nx;drill.y=ny;}

/* ===================== RENDER (low-res + chromatic aberration) ===================== */
const ctx=cv.getContext('2d');
let W=0,H=0,PIX=3,LW=0,LH=0;
let oc,octx,cr_,crc,cb,cbc;             // offscreen scene + channel buffers
let patterns=[];                        // granular ground patterns per theme
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';
  PIX=W<520?3:4;LW=Math.ceil(W/PIX);LH=Math.ceil(H/PIX);
  oc=document.createElement('canvas');oc.width=LW;oc.height=LH;octx=oc.getContext('2d');
  cr_=document.createElement('canvas');cr_.width=LW;cr_.height=LH;crc=cr_.getContext('2d');
  cb=document.createElement('canvas');cb.width=LW;cb.height=LH;cbc=cb.getContext('2d');
  ctx.imageSmoothingEnabled=false;octx.imageSmoothingEnabled=false;
  buildPatterns();
}
function buildPatterns(){patterns=[];const ts=Math.max(6,Math.round(TILE/PIX));
  for(let k=0;k<6;k++){const p=document.createElement('canvas');p.width=ts;p.height=ts;const pc=p.getContext('2d');
    pc.fillStyle=T.ground[0];pc.fillRect(0,0,ts,ts);
    let seed=1000+k*97;const rr=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
    const dots=Math.floor(ts*ts*0.5);
    for(let i=0;i<dots;i++){const x=Math.floor(rr()*ts),y=Math.floor(rr()*ts),v=rr();
      pc.fillStyle=v<0.45?T.ground[1]:v<0.7?T.ground[2]:T.ground[0];pc.fillRect(x,y,1,1);}
    patterns.push({cv:p,ts});}}
window.addEventListener('resize',resize);resize();

function scene(){
  const o=octx;o.imageSmoothingEnabled=false;
  const sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  const camx=drill.x-W/2+sx,camy=drill.y-H*0.44+sy;
  const S1=1/PIX; // world px -> low-res px
  // space background
  const depthT=Math.min(1,run.depthMax/90);
  const g=o.createLinearGradient(0,0,0,LH);
  g.addColorStop(0,mix(T.space,T.space2,depthT));g.addColorStop(1,mix(T.space2,'#000',depthT*0.6));
  o.fillStyle=g;o.fillRect(0,0,LW,LH);
  // star noise w/ chromatic dots
  o.globalAlpha=0.7;for(let i=0;i<70;i++){const px=(i*137.5%LW),py=((i*89.3)%LH);
    const yy=py-(camy*0.15)*S1;const y2=((yy%LH)+LH)%LH;o.fillStyle=i%3?'#fff':T.accent;o.fillRect(px|0,y2|0,1,1);}
  o.globalAlpha=1;
  // round planet silhouette near surface (nod to reference)
  if(run.depthMax<28){const surfY=(0-camy)*S1;const cxp=LW/2,cyp=surfY+LW*1.15,rad=LW*1.2;
    o.save();o.beginPath();o.arc(cxp,cyp,rad,0,6.283);o.clip();
    // granular planet crust
    o.fillStyle=T.space2;o.fillRect(0,0,LW,LH);
    let sd=777;const rr=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;};
    o.globalAlpha=0.9;for(let i=0;i<1400;i++){o.fillStyle=rr()<0.6?T.planet:T.ground[2];
      o.fillRect((rr()*LW)|0,(cyp-rad+rr()*rad*0.5)|0,1,1);}o.globalAlpha=1;o.restore();}
  // tiles
  const c0=Math.max(0,Math.floor(camx/TILE)),c1=Math.min(COLS-1,Math.floor((camx+W)/TILE));
  const r0=Math.max(0,Math.floor(camy/TILE)),r1=Math.floor((camy+H)/TILE);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(!t||t.wall)continue;
    const x=((c*TILE-camx)*S1)|0,y=((r*TILE-camy)*S1)|0;const p=patterns[hash(c,r)%patterns.length];
    o.drawImage(p.cv,x,y);
    const dmgT=1-t.hp/t.maxhp;
    if(dmgT>0.05){o.fillStyle='rgba(0,0,0,'+(dmgT*0.5)+')';o.fillRect(x+1,y+1,p.ts-2,p.ts-2);}
    if(t.res){const R=RES[t.res],cx=x+p.ts/2,cy=y+p.ts/2,s=Math.max(2,p.ts*0.22);
      o.fillStyle=R.color;o.fillRect((cx-s)|0,(cy-s)|0,(s*2)|0,(s*2)|0);
      o.fillStyle=R.glow;o.fillRect((cx-s*0.5)|0,(cy-s*0.5)|0,Math.max(1,s)|0,Math.max(1,s)|0);}}
  // drops
  for(const dp of drops){const R=RES[dp.id],x=((dp.x-camx)*S1)|0,y=((dp.y-camy)*S1)|0,s=Math.max(2,(3+Math.sin(dp.t*8))|0);
    o.fillStyle=R.glow;o.fillRect(x-s,y-s,s*2,s*2);o.fillStyle=R.color;o.fillRect(x-s+1,y-s+1,s,s);}
  // particles
  for(const p of parts){const a=1-p.age/p.life;o.globalAlpha=a;o.fillStyle=p.color;
    o.fillRect(((p.x-camx)*S1)|0,((p.y-camy)*S1)|0,p.size,p.size);}o.globalAlpha=1;
  // drill pod (round, tri-blob)
  drawPod(((drill.x-camx)*S1),((drill.y-camy)*S1));
  // damage numbers (chunky)
  o.textAlign='center';o.textBaseline='middle';
  for(const d of dmgnums){const a=1-d.age/d.life;o.globalAlpha=a;o.fillStyle=d.color;
    o.font='bold '+Math.round(9)+'px monospace';
    o.fillText(''+d.v,((d.x-camx)*S1)|0,((d.y-camy)*S1)|0);}o.globalAlpha=1;
  // HUD (drawn low-res => pixelated + gets CA)
  hud(o,S1);
}
function drawPod(cx,cy){const o=octx,S1=1/PIX,rad=Math.max(6,TILE*0.5*S1);
  // ring
  o.strokeStyle=T.ring;o.lineWidth=Math.max(1,Math.round(2));o.beginPath();o.arc(cx,cy,rad,0,6.283);o.stroke();
  o.fillStyle=T.space2;o.beginPath();o.arc(cx,cy,rad-1,0,6.283);o.fill();
  // tri-blobs
  const pulse=0.5+Math.sin(performance.now()/220)*0.5,br=rad*0.42;
  for(let i=0;i<3;i++){const a=performance.now()/900+i*2.094,bx=cx+Math.cos(a)*rad*0.28,by=cy+Math.sin(a)*rad*0.28;
    o.fillStyle=T.blob;o.globalAlpha=0.85+pulse*0.15;o.beginPath();o.arc(bx,by,br,0,6.283);o.fill();}
  o.globalAlpha=1;
  // drill teeth in facing dir when digging
  if(drilling){o.fillStyle=T.fuel;const dx=Math.cos(drill.face),dy=Math.sin(drill.face);
    for(let i=0;i<4;i++){const t=rad+2+i;o.fillRect((cx+dx*t)|0,(cy+dy*t)|0,2,2);}}}
function hud(o,S1){
  o.textBaseline='top';
  // cash top-right
  o.textAlign='right';o.font='bold 11px monospace';o.fillStyle=T.accent;
  o.fillText(money(meta.credits+(run.active?run.haul:0)),LW-6,6);
  // depth / HOME top-left
  o.textAlign='left';o.fillStyle='#fff';o.font='bold 11px monospace';
  o.fillText(run.active?('DEPTH '+run.depthMax+'m'):'',6,6);
  if(run.active&&run.depthMax>3){o.fillStyle='#fff';o.textAlign='center';o.font='bold 12px monospace';
    o.fillText('HOME[↑'+run.depthMax+']',LW/2,Math.max(14,(-drill.y*0+18)) );}
  // fuel bar bottom-left
  const bw=Math.min(LW*0.5,150),bx=6,by=LH-((window.innerHeight*0)+34);
  o.textAlign='left';o.fillStyle='#fff';o.font='bold 10px monospace';
  o.fillText('FUEL '+run.energy.toFixed(1)+'/'+S.energyMax.toFixed(0),bx,by-12);
  o.fillStyle='#000';o.fillRect(bx,by,bw,9);o.strokeStyle='#fff';o.lineWidth=1;o.strokeRect(bx+0.5,by+0.5,bw-1,8);
  o.fillStyle=T.fuel;o.fillRect(bx+1,by+1,(bw-2)*(run.energy/S.energyMax),7);
  // heat pips
  o.fillStyle=run.heat>70?T.dmg:T.ground[1];o.fillText('HEAT '+run.heat.toFixed(0)+'%',bx,by+11);
}
function draw(){
  scene();
  // chromatic aberration via channel split
  const ca=T.ca*(1+glitch*4);
  crc.clearRect(0,0,LW,LH);crc.drawImage(oc,0,0);crc.globalCompositeOperation='multiply';
  crc.fillStyle='#ff0000';crc.fillRect(0,0,LW,LH);crc.globalCompositeOperation='source-over';
  cbc.clearRect(0,0,LW,LH);cbc.drawImage(oc,0,0);cbc.globalCompositeOperation='multiply';
  cbc.fillStyle='#00ffff';cbc.fillRect(0,0,LW,LH);cbc.globalCompositeOperation='source-over';
  const jx=T.jitter?(Math.random()-0.5)*2:0, jy=T.jitter?(Math.random()-0.5)*2:0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.imageSmoothingEnabled=false;ctx.globalCompositeOperation='lighter';
  ctx.drawImage(cr_,0,0,LW,LH,(-ca+jx),jy,LW*PIX,LH*PIX);
  ctx.drawImage(cb,0,0,LW,LH,(ca+jx),jy,LW*PIX,LH*PIX);
  ctx.globalCompositeOperation='source-over';
  // scanlines
  if(T.scan>0){ctx.fillStyle='rgba(0,0,0,'+T.scan+')';for(let y=0;y<H;y+=PIX*2)ctx.fillRect(0,y,W,PIX);}
  // noise
  if(T.noise>0){ctx.globalAlpha=T.noise;for(let i=0;i<90;i++){ctx.fillStyle=Math.random()<0.5?'#fff':'#000';
    ctx.fillRect((Math.random()*W)|0,(Math.random()*H)|0,PIX,PIX);}ctx.globalAlpha=1;}
  // tint
  if(T.tint){ctx.globalCompositeOperation='overlay';ctx.fillStyle=T.tint;ctx.globalAlpha=0.08;
    ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  // flash
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.5)+')';ctx.fillRect(0,0,W,H);}
  // heat vignette
  if(run.heat>70){const v=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.65);
    const a=(run.heat-70)/30*0.5;v.addColorStop(0,'rgba(255,50,30,0)');v.addColorStop(1,'rgba(255,40,20,'+a+')');
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
}
function money(n){n=Math.round(n);if(n>=1e6)return'$'+(n/1e6).toFixed(3)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(2)+'K';return'$'+n;}
function mix(a,b,t){const pa=hx(a),pb=hx(b);return'rgb('+Math.round(pa[0]+(pb[0]-pa[0])*t)+','+Math.round(pa[1]+(pb[1]-pa[1])*t)+','+Math.round(pa[2]+(pb[2]-pa[2])*t)+')';}
function hx(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}

/* ===================== HUD DOM sync ===================== */
const shockCdEl=document.getElementById('shockCd');
function syncDOM(){shockCdEl.style.transform='scaleY('+(run.shockCd/5)+')';}

/* ===================== LOOP ===================== */
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(hitstop>0)hitstop-=dt;else update(dt);draw();syncDOM();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* ===================== UI ===================== */
function show(id){document.getElementById(id).classList.add('show');}
function hide(id){document.getElementById(id).classList.remove('show');}
let hintTimer;function showHint(){const h=document.getElementById('hint');h.style.opacity='1';clearTimeout(hintTimer);hintTimer=setTimeout(hideHint,4000);}
function hideHint(){document.getElementById('hint').style.opacity='0';}
document.getElementById('btnStart').onclick=()=>{sfx.ui();startRun();};
document.getElementById('btnDescend').onclick=()=>{sfx.ui();startRun();};
document.getElementById('btnExtract').onclick=extract;
document.getElementById('btnShock').onclick=shockwave;
document.getElementById('btnSound').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';if(!muted){audio();if(AC&&AC.state==='suspended')AC.resume();}};
document.querySelectorAll('.skin').forEach(b=>b.onclick=function(){
  TK=this.dataset.s;T=THEMES[TK];buildPatterns();
  document.querySelectorAll('.skin').forEach(x=>x.classList.remove('on'));this.classList.add('on');sfx.ui();});
})();
</script>
